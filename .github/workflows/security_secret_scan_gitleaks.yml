name: Security Secret Scanning

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.28.0"

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz
          sudo install gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks.json \
            --no-banner

      - name: Create PR Comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json
          import os

          report = "gitleaks.json"

          if not os.path.exists(report):
              findings = []
          else:
              try:
                  with open(report) as f:
                      findings = json.load(f)
              except (json.JSONDecodeError, ValueError):
                  findings = []

          with open("comment.md", "w") as out:
              out.write("## Gitleaks Secret Scan\n\n")

              if not findings:
                  out.write("✅ **No secrets detected.**\n")
              else:
                  out.write(
                      f"❌ **{len(findings)} potential secret(s) detected.**\n\n"
                  )

                  out.write("### Top 10 Findings\n\n")

                  out.write(
                      "| # | Secret Type | File | Line | Description |\n"
                      "|---|-------------|------|------|-------------|\n"
                  )

                  for i, finding in enumerate(findings[:10], 1):
                      rule = finding.get("RuleID", "N/A")
                      file_path = finding.get("File", "N/A")
                      line = finding.get("StartLine", "N/A")
                      description = finding.get("Description", rule)

                      rule = str(rule).replace("|", "\\|")
                      file_path = str(file_path).replace("|", "\\|")
                      description = (
                          str(description)
                          .replace("|", "\\|")
                          .replace("\n", " ")
                      )

                      out.write(
                          f"| {i} | `{rule}` | `{file_path}` | "
                          f"{line} | {description} |\n"
                      )

                  if len(findings) > 10:
                      out.write(
                          f"\n> Showing the top 10 of {len(findings)} findings."
                      )
          PY

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gitleaks-security
          recreate: true
          path: comment.md

      - name: Block PR on secrets
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Gitleaks detected potential secrets."
          exit 1
