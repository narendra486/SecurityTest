name: Security Code Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --json \
            --output semgrep.json \
            --error

      - name: Create PR Comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json

          with open("semgrep.json") as f:
              data = json.load(f)

          results = data.get("results", [])

          print(f"Total ERROR findings: {len(results)}")

          with open("comment.md", "w") as out:
              out.write("## Semgrep Security Scan\n\n")

              if not results:
                  out.write("✅ **No ERROR-level security findings detected.**\n")
              else:
                  out.write(
                      f"❌ **{len(results)} ERROR-level findings detected.**\n\n"
                  )

                  out.write("### Top 10 Findings\n\n")
                  out.write(
                      "| # | Rule | File | Line | Message |\n"
                      "|---|------|------|------|---------|\n"
                  )

                  for i, result in enumerate(results[:10], 1):
                      rule = result.get("check_id", "N/A")
                      message = result.get("extra", {}).get(
                          "message", "N/A"
                      ).replace("|", "\\|").replace("\n", " ")

                      path = result.get("path", "N/A")
                      line = result.get("start", {}).get("line", "N/A")

                      out.write(
                          f"| {i} | `{rule}` | `{path}` | "
                          f"{line} | {message} |\n"
                      )

                  if len(results) > 10:
                      out.write(
                          f"\n> Showing the top 10 of "
                          f"{len(results)} findings. "
                          "See GitHub Code Scanning for the complete results.\n"
                      )
          PY

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: semgrep-security
          recreate: true
          path: comment.md

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      - name: Block PR on ERROR findings
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "Semgrep found ERROR-level security findings."
          exit 1
