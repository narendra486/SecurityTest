name: Security Code Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --json \
            --output semgrep.json

      - name: Create PR Comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json

          with open("semgrep.json") as f:
              data = json.load(f)

          results = data.get("results", [])

          with open("comment.md", "w") as out:
              out.write("## Semgrep Security Scan\n\n")

              if not results:
                  out.write("✅ **No ERROR-level security findings detected.**\n")
              else:
                  out.write(
                      f"❌ **{len(results)} ERROR-level findings detected.**\n\n"
                  )

                  out.write("### Top 10 Findings\n\n")

                  out.write(
                      "| # | Bug | Severity | File | Line | Description | Rule ID |\n"
                      "|---|-----|----------|------|------|-------------|---------|\n"
                  )

                  for i, result in enumerate(results[:10], 1):
                      extra = result.get("extra", {})
                      metadata = extra.get("metadata", {})

                      rule_id = result.get("check_id", "N/A")

                      bug_name = metadata.get("name", rule_id)

                      severity = extra.get("severity", "ERROR")

                      description = extra.get(
                          "message",
                          "No description available"
                      )

                      file_path = result.get("path", "N/A")

                      line = result.get(
                          "start",
                          {}
                      ).get("line", "N/A")

                      # Keep Markdown table valid
                      bug_name = (
                          str(bug_name)
                          .replace("|", "\\|")
                          .replace("\n", " ")
                      )

                      description = (
                          str(description)
                          .replace("|", "\\|")
                          .replace("\n", " ")
                      )

                      out.write(
                          f"| {i} | **{bug_name}** | **{severity}** | "
                          f"`{file_path}` | {line} | {description} | "
                          f"`{rule_id}` |\n"
                      )

                  if len(results) > 10:
                      out.write(
                          f"\n> Showing the top 10 of {len(results)} findings. "
                          "See the GitHub Code Scanning results for the complete list.\n"
                      )

          PY

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: semgrep-security
          recreate: true
          path: comment.md

      - name: Generate SARIF
        if: always()
        run: |
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Block PR on ERROR findings
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "Semgrep found ERROR-level security findings."
          exit 1
