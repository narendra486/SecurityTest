name: Security IaC Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          output: trivy-summary.txt
          exit-code: '0'

      - name: Create PR Summary
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Trivy IaC Scan"
            echo
            echo '```text'
            cat trivy-summary.txt
            echo '```'
          } > comment.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-iac
          recreate: true
          path: comment.md
