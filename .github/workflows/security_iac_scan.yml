name: Security IaC Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        run: |
          trivy config . \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy.json

      - name: Create PR Summary
        run: |
          trivy config . \
            --severity HIGH,CRITICAL \
            --format table \
            > trivy-summary.txt

          {
            echo "## Trivy IaC Scan"
            echo
            echo '```text'
            cat trivy-summary.txt
            echo '```'
          } > comment.md

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-iac
          recreate: true
          path: comment.md
